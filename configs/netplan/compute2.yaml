# /etc/netplan/01-openstack.yaml — compute2
# Replace enp1s0 with the real interface name (`ip -br link`).
network:
  version: 2
  renderer: networkd
  ethernets:
    enp1s0:
      dhcp4: false
      addresses: [192.168.100.26/24]
      routes:
        - to: default
          via: 192.168.100.1
      nameservers:
        addresses: [1.1.1.1, 8.8.8.8]
