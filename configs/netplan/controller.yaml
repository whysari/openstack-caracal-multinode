# /etc/netplan/01-openstack.yaml — controller
#
# The controller is both the control-plane node and the Neutron network node.
# The single physical NIC is enslaved to the OVS provider bridge, and the
# management/provider IP lives on br-ex. This is the single-NIC variant of the
# install guide: management and provider traffic share 192.168.100.0/24.
#
# Install openvswitch-switch BEFORE applying this file:
#   sudo apt install -y openvswitch-switch
#
# Replace enp1s0 with the real interface name (`ip -br link`).
network:
  version: 2
  renderer: networkd
  ethernets:
    enp1s0:
      dhcp4: false
      optional: true
  bridges:
    br-ex:
      interfaces: [enp1s0]
      addresses: [192.168.100.24/24]
      routes:
        - to: default
          via: 192.168.100.1
      nameservers:
        addresses: [1.1.1.1, 8.8.8.8]
      openvswitch: {}
