# /etc/netplan/01-openstack.yaml — network01
#
# enp1s0 = management (API, VXLAN underlay)
# enp2s0 = provider / external NIC, enslaved to the OVS bridge br-ex
#
# Install openvswitch-switch BEFORE running `netplan apply`:
#   sudo apt install -y openvswitch-switch
#
# br-ex deliberately has no IP address. The router namespace owns the
# external gateway and floating IPs; giving br-ex an address would break
# the flat provider data path.
network:
  version: 2
  renderer: networkd
  ethernets:
    enp1s0:
      dhcp4: false
      addresses:
        - 10.10.10.31/24
      routes:
        - to: default
          via: 10.10.10.1
      nameservers:
        addresses: [1.1.1.1, 8.8.8.8]
    enp2s0:
      dhcp4: false
      optional: true
  bridges:
    br-ex:
      interfaces: [enp2s0]
      openvswitch: {}
      parameters:
        forward-delay: 0
