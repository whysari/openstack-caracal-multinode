# /etc/swift/swift.conf — identical on all Swift nodes
# The hash prefix/suffix must match everywhere or objects land in the
# wrong partitions. Generate once and distribute:
#   python3 -c "import uuid; print(uuid.uuid4().hex)"

[swift-hash]
swift_hash_path_suffix = CHANGE_ME_HASH_SUFFIX
swift_hash_path_prefix = CHANGE_ME_HASH_PREFIX

[storage-policy:0]
name = Policy-0
default = yes
