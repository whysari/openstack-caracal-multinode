# /etc/rsyncd.conf — storage01, compute01, compute02
# Swift replication is unauthenticated: keep it on the private
# management network and firewall TCP/873 to the three Swift nodes.

uid = swift
gid = swift
log file = /var/log/rsyncd.log
pid file = /var/run/rsyncd.pid
address = 0.0.0.0

[account]
max connections = 4
path = /srv/node/
read only = false
lock file = /var/lock/account.lock

[container]
max connections = 4
path = /srv/node/
read only = false
lock file = /var/lock/container.lock

[object]
max connections = 8
path = /srv/node/
read only = false
lock file = /var/lock/object.lock
