# /etc/swift/account-server.conf — storage01, compute01, compute02
# bind_ip is intentionally 0.0.0.0 for a management-only lab; pin it to
# the node's 10.10.10.x address in anything exposed.

[DEFAULT]
bind_ip = 0.0.0.0
bind_port = 6202
user = swift
swift_dir = /etc/swift
devices = /srv/node
mount_check = true
log_name = swift-account

[pipeline:main]
pipeline = healthcheck recon account-server

[filter:recon]
use = egg:swift#recon
recon_cache_path = /var/cache/swift
