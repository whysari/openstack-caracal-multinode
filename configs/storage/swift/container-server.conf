# /etc/swift/container-server.conf — storage01, compute01, compute02

[DEFAULT]
bind_ip = 0.0.0.0
bind_port = 6201
user = swift
swift_dir = /etc/swift
devices = /srv/node
mount_check = true
log_name = swift-container

[pipeline:main]
pipeline = healthcheck recon container-server

[filter:recon]
use = egg:swift#recon
recon_cache_path = /var/cache/swift
