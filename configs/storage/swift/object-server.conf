# /etc/swift/object-server.conf — storage01, compute01, compute02

[DEFAULT]
bind_ip = 0.0.0.0
bind_port = 6200
user = swift
swift_dir = /etc/swift
devices = /srv/node
mount_check = true
log_name = swift-object

[pipeline:main]
pipeline = healthcheck recon object-server

[filter:recon]
use = egg:swift#recon
recon_cache_path = /var/cache/swift
recon_lock_path = /var/lock

[object-replicator]
# Default target: rsync daemon module "object" on the peer, device appended.
rsync_module = {replication_ip}::object
