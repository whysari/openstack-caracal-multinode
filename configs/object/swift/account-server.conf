# /etc/swift/account-server.conf — object (192.168.100.28)
# The four "devices" are directories under /srv/node, so mount_check is
# disabled. On a real deployment each device would be a separate filesystem
# and mount_check should be true.

[DEFAULT]
bind_ip = 0.0.0.0
bind_port = 6002
user = swift
swift_dir = /etc/swift
devices = /srv/node
mount_check = false
log_name = swift-account

[pipeline:main]
pipeline = healthcheck recon account-server

[filter:recon]
use = egg:swift#recon
recon_cache_path = /var/cache/swift
