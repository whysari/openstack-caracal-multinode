# /etc/swift/swift.conf — controller and object
# The hash prefix/suffix must match on every Swift node. Generate once:
#   python3 -c "import uuid; print(uuid.uuid4().hex)"

[swift-hash]
swift_hash_path_suffix = CHANGE_ME_HASH_SUFFIX
swift_hash_path_prefix = CHANGE_ME_HASH_PREFIX

[storage-policy:0]
name = Policy-0
default = yes
