# /etc/rsyncd.conf — object (192.168.100.28)
# Swift replication is unauthenticated: keep TCP/873 on the private
# 192.168.100.0/24 network and firewall it from untrusted hosts.
# With a single object node there are no peers yet; the daemon is enabled
# so adding object2/object3 later only requires ring changes.

uid = swift
gid = swift
log file = /var/log/rsyncd.log
pid file = /var/run/rsyncd.pid
address = 192.168.100.28

[account]
max connections = 4
path = /srv/node/
read only = false
lock file = /var/lock/account.lock

[container]
max connections = 4
path = /srv/node/
read only = false
lock file = /var/lock/container.lock

[object]
max connections = 8
path = /srv/node/
read only = false
lock file = /var/lock/object.lock
