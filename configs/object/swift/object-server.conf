# /etc/swift/object-server.conf — object (192.168.100.28)

[DEFAULT]
bind_ip = 0.0.0.0
bind_port = 6000
user = swift
swift_dir = /etc/swift
devices = /srv/node
mount_check = false
log_name = swift-object

[pipeline:main]
pipeline = healthcheck recon object-server

[filter:recon]
use = egg:swift#recon
recon_cache_path = /var/cache/swift
recon_lock_path = /var/lock

[object-replicator]
# Default target: the rsync daemon module "object" on the peer, with the
# device name appended.
rsync_module = {replication_ip}::object
