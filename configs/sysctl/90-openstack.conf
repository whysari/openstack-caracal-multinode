# /etc/sysctl.d/90-openstack.conf
# network01 forwards tenant <-> provider traffic; computes route VXLAN.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# Neutron manages filtering in namespaces; keep reverse-path filtering
# permissive so asymmetric floating-IP traffic is not dropped.
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0

# ARP flux / proxy behaviour on multi-homed network nodes
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
