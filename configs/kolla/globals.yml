---
# Kolla-Ansible Production Configuration (3-Node Cluster)
# Target: controller (10.10.10.11), compute01 (10.10.10.21), compute02 (10.10.10.22)
# Host OS: Ubuntu 24.04 LTS (Noble Numbat)

workaround_ansible_issue_8743: yes
config_strategy: "COPY_ALWAYS"

# Distro & Release Specifications
kolla_base_distro: "ubuntu"
kolla_base_distro_version: "noble"
openstack_release: "2024.1"

# Logging Optimization (Disable heavy Fluentd to save ~2-4 GB RAM on 16 GB host budget)
enable_fluentd: "no"

# High Availability Virtual IP (HAProxy + Keepalived on ens33)
kolla_internal_vip_address: "10.10.10.250"

# 3-Plane Network Interfaces
network_interface: "ens33"
tunnel_interface: "ens34"
neutron_external_interface: "ens32"

# SDN Plugin: ML2 + Open vSwitch (br-int, br-tun, br-ex, qrouter, qdhcp)
neutron_plugin_agent: "openvswitch"
enable_neutron_provider_networks: "yes"

# Hypervisor Acceleration (Nested VT-x /dev/kvm verified)
nova_compute_virt_type: "kvm"

# Core OpenStack Services
enable_haproxy: "yes"
enable_keepalived: "yes"
enable_keystone: "yes"
enable_glance: "yes"
enable_placement: "yes"
enable_nova: "yes"
enable_neutron: "yes"
enable_horizon: "yes"

# Block Storage (Cinder LVM + iSCSI on controller:/dev/sdb)
enable_cinder: "yes"
enable_cinder_backend_lvm: "yes"
cinder_volume_group: "cinder-volumes"

# Memory Optimization for 16 GB Host RAM Budget (1 worker per API/RPC daemon)
openstack_service_workers: "1"
openstack_service_rpc_workers: "1"
