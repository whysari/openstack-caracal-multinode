# /etc/glance/glance-api.conf — controller01

[DEFAULT]
transport_url = rabbit://openstack:RABBIT_PASS@controller01:5672/
bind_host = 10.10.10.11
bind_port = 9292
log_dir = /var/log/glance

[database]
connection = mysql+pymysql://glance:GLANCE_DBPASS@controller01/glance

[keystone_authtoken]
www_authenticate_uri = http://controller01:5000
auth_url = http://controller01:5000
memcached_servers = controller01:11211
auth_type = password
project_domain_name = Default
user_domain_name = Default
project_name = service
username = glance
password = GLANCE_PASS

[paste_deploy]
flavor = keystone

[glance_store]
stores = file,http
default_store = file
filesystem_store_datadir = /var/lib/glance/images/
