# /etc/default/etcd — controller
# Etcd is installed on the controller as part of the Caracal service set.
# The original build did not wire it into Cinder's active-active
# coordination; it is documented here as the single-node baseline.

ETCD_NAME="controller"
ETCD_DATA_DIR="/var/lib/etcd"
ETCD_LISTEN_PEER_URLS="http://192.168.100.24:2380"
ETCD_LISTEN_CLIENT_URLS="http://192.168.100.24:2379"
ETCD_INITIAL_ADVERTISE_PEER_URLS="http://192.168.100.24:2380"
ETCD_INITIAL_CLUSTER="controller=http://192.168.100.24:2380"
ETCD_INITIAL_CLUSTER_STATE="new"
ETCD_INITIAL_CLUSTER_TOKEN="etcd-cluster-01"
ETCD_ADVERTISE_CLIENT_URLS="http://192.168.100.24:2379"
