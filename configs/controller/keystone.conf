# /etc/keystone/keystone.conf — controller01
# Passwords are placeholders. Never commit real credentials.

[DEFAULT]
log_dir = /var/log/keystone

[database]
connection = mysql+pymysql://keystone:KEYSTONE_DBPASS@controller01/keystone

[token]
provider = fernet
expiration = 3600

[cache]
enabled = true
backend = oslo_cache.memcache_pool
memcache_servers = controller01:11211
