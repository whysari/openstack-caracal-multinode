# /etc/cinder/cinder.conf — controller01 (API + scheduler)
# cinder-volume runs on storage01 with the LVM/iSCSI backend.

[DEFAULT]
transport_url = rabbit://openstack:RABBIT_PASS@controller01:5672/
auth_strategy = keystone
my_ip = 10.10.10.11
glance_api_servers = http://controller01:9292
state_path = /var/lib/cinder
rootwrap_config = /etc/cinder/rootwrap.conf
api_paste_config = /etc/cinder/api-paste.ini
log_dir = /var/log/cinder

[database]
connection = mysql+pymysql://cinder:CINDER_DBPASS@controller01/cinder

[keystone_authtoken]
www_authenticate_uri = http://controller01:5000
auth_url = http://controller01:5000
memcached_servers = controller01:11211
auth_type = password
project_domain_name = Default
user_domain_name = Default
project_name = service
username = cinder
password = CINDER_PASS

[oslo_concurrency]
lock_path = /var/lib/cinder/tmp
