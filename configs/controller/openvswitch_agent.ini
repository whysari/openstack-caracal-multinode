# /etc/neutron/plugins/ml2/openvswitch_agent.ini — controller
# The controller is also the network node: it owns br-ex and the VXLAN
# tunnel endpoint, and runs the L3/DHCP/metadata agents.

[ovs]
bridge_mappings = provider:br-ex
local_ip = 192.168.100.24

[agent]
tunnel_types = vxlan
l2_population = true

[securitygroup]
enable_security_group = true
firewall_driver = openvswitch
