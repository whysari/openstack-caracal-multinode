# /etc/neutron/plugins/ml2/openvswitch_agent.ini — compute1
# No bridge_mappings: floating IPs terminate in the router namespace on the
# controller. The compute only needs br-int and br-tun.

[ovs]
local_ip = 192.168.100.25

[agent]
tunnel_types = vxlan
l2_population = true

[securitygroup]
enable_security_group = true
firewall_driver = openvswitch
