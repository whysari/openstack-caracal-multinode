# /etc/nova/nova.conf — compute2 (192.168.100.26)
# The original demo intentionally stopped compute2's nova-compute and OVS
# agent; enable them to run the full two-compute topology.

[DEFAULT]
my_ip = 192.168.100.26
state_path = /var/lib/nova
transport_url = rabbit://openstack:RABBIT_PASS@controller:5672/
log_dir = /var/log/nova
instances_path = /var/lib/nova/instances
use_neutron = true

[api]
auth_strategy = keystone

[keystone_authtoken]
www_authenticate_uri = http://controller:5000
auth_url = http://controller:5000
memcached_servers = controller:11211
auth_type = password
project_domain_name = Default
user_domain_name = Default
project_name = service
username = nova
password = NOVA_PASS

[service_user]
send_service_user_token = true
auth_url = http://controller:5000
auth_strategy = keystone
auth_type = password
project_domain_name = Default
project_name = service
user_domain_name = Default
username = nova
password = NOVA_PASS

[oslo_concurrency]
lock_path = /var/lib/nova/tmp

[placement]
region_name = RegionOne
project_domain_name = Default
project_name = service
auth_type = password
user_domain_name = Default
auth_url = http://controller:5000
username = placement
password = PLACEMENT_PASS

[glance]
api_servers = http://controller:9292

[neutron]
auth_url = http://controller:5000
auth_type = password
project_domain_name = Default
user_domain_name = Default
region_name = RegionOne
project_name = service
username = neutron
password = NEUTRON_PASS

[cinder]
os_region_name = RegionOne

[vnc]
enabled = true
server_listen = 0.0.0.0
server_proxyclient_address = 192.168.100.26
novncproxy_base_url = http://192.168.100.24:6080/vnc_auto.html

[libvirt]
virt_type = kvm
