# /etc/neutron/plugins/ml2/openvswitch_agent.ini — compute2
# The original demo had this service stopped. Start it to enable the second
# compute in the VXLAN overlay.

[ovs]
local_ip = 192.168.100.26

[agent]
tunnel_types = vxlan
l2_population = true

[securitygroup]
enable_security_group = true
firewall_driver = openvswitch
