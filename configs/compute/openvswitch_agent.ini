# /etc/neutron/plugins/ml2/openvswitch_agent.ini — compute01
# No bridge_mappings: provider networks are only reachable through the
# router namespace on network01, so compute nodes need br-int + br-tun only.

[ovs]
local_ip = 10.10.10.21

[agent]
tunnel_types = vxlan
l2_population = true

[securitygroup]
enable_security_group = true
firewall_driver = openvswitch
