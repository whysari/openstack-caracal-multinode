# /etc/nova/nova.conf — compute01 (repeat on compute02 with my_ip changed)

[DEFAULT]
my_ip = 10.10.10.21
state_path = /var/lib/nova
transport_url = rabbit://openstack:RABBIT_PASS@controller01:5672/
log_dir = /var/log/nova
instances_path = /var/lib/nova/instances
use_neutron = true

[api]
auth_strategy = keystone

[keystone_authtoken]
www_authenticate_uri = http://controller01:5000
auth_url = http://controller01:5000
memcached_servers = controller01:11211
auth_type = password
project_domain_name = Default
user_domain_name = Default
project_name = service
username = nova
password = NOVA_PASS

[service_user]
send_service_user_token = true
auth_url = http://controller01:5000
auth_strategy = keystone
auth_type = password
project_domain_name = Default
project_name = service
user_domain_name = Default
username = nova
password = NOVA_PASS

[oslo_concurrency]
lock_path = /var/lib/nova/tmp

[placement]
region_name = RegionOne
project_domain_name = Default
project_name = service
auth_type = password
user_domain_name = Default
auth_url = http://controller01:5000
username = placement
password = PLACEMENT_PASS

[glance]
api_servers = http://controller01:9292

[neutron]
auth_url = http://controller01:5000
auth_type = password
project_domain_name = Default
user_domain_name = Default
region_name = RegionOne
project_name = service
username = neutron
password = NEUTRON_PASS

[vnc]
enabled = true
server_listen = 0.0.0.0
server_proxyclient_address = 10.10.10.21
novncproxy_base_url = http://10.10.10.11:6080/vnc_auto.html

[libvirt]
# Use qemu if the host does not expose VT-x/AMD-V to the guest (`egrep -c '(vmx|svm)' /proc/cpuinfo`).
virt_type = kvm
