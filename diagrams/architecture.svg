  <rect x="40" y="24" width="6" height="112" rx="3" fill="#8a94a6"/>
  <text class="t title" x="64" y="52">Management + flat provider · 192.168.100.0/24</text>
  <text class="t sub" x="64" y="72">host management, API endpoints, SQL/AMQP, VXLAN underlay, provider network and floating IPs</text>

  <rect class="chip" x="64" y="86" width="220" height="38" rx="8"/>
