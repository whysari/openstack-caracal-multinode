  <line class="data" x1="1200" y1="340" x2="1240" y2="340" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
  <line class="data" x1="760" y1="570" x2="900" y2="510" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
  <line class="iscsi" x1="1030" y1="570" x2="1030" y2="510" marker-end="url(#arrow-orange)" marker-start="url(#arrow-orange)"/>
  <path class="swift" d="M 1240 680 L 1220 680 L 1220 548 L 800 548 L 800 530" marker-end="url(#arrow-green)" marker-start="url(#arrow-green)"/>
  <line class="mgmt" x1="700" y1="530" x2="900" y2="570" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)"/>

