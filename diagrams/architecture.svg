  <text class="t label" x="830" y="532" text-anchor="middle">tenant port</text>
  <text class="t label" x="1040" y="545">iSCSI 3260</text>
  <text class="t label" x="1005" y="540" text-anchor="middle">Swift API</text>
  <text class="t label" x="790" y="552" text-anchor="middle">Cinder API</text>
  <text class="t label" x="410" y="158">provider + mgmt</text>

  <!-- ================= NOTES ================= -->
  <rect x="40" y="830" width="1520" height="180" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="t title" x="64" y="860">Deployment notes</text>

  <text class="t note" x="64" y="890">3 physical nodes: controller, compute1, compute2</text>
  <text class="t note" x="64" y="912">2 virtual nodes: block (Cinder), object (Swift)</text>
  <text class="t note" x="64" y="934">controller = control plane + Neutron network node (br-ex, L3, DHCP, metadata, OVS)</text>
  <text class="t note" x="64" y="956">management and provider share 192.168.100.0/24; floating IPs .101–.250</text>
  <text class="t note" x="64" y="978">single controller and single Swift node: lab topology, no HA or node-level replication</text>

  <line x1="820" y1="876" x2="880" y2="876" class="data" marker-end="url(#arrow-blue)"/>
  <text class="t note" x="892" y="880">VXLAN / tenant traffic</text>

  <line x1="820" y1="902" x2="880" y2="902" class="swift" marker-end="url(#arrow-green)"/>
  <text class="t note" x="892" y="906">Swift API / data</text>

  <line x1="820" y1="928" x2="880" y2="928" class="iscsi" marker-end="url(#arrow-orange)"/>
  <text class="t note" x="892" y="932">iSCSI block traffic</text>

  <line x1="820" y1="954" x2="880" y2="954" class="mgmt" marker-end="url(#arrow-gray)"/>
  <text class="t note" x="892" y="958">management / AMQP / REST</text>

  <text class="t note" x="1120" y="880">Acceptance gate: scripts/20-smoke-test.sh</text>
  <text class="t note" x="1120" y="902">Build guide: docs/01 … docs/10</text>
  <text class="t note" x="1120" y="924">Completion checklist: docs/11-completing-the-build.md</text>
  <text class="t note" x="1120" y="946">Credentials in configs are placeholders.</text>
  <text class="t note" x="1120" y="968">See configs/README.md for the secret list.</text>
