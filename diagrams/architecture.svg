  <rect class="chip" x="1264" y="690" width="272" height="44" rx="8"/>
  <text class="t chip-main" x="1278" y="708">/srv/node/1..4</text>
  <text class="t chip-sub" x="1278" y="723">4 devices · mount_check = false</text>

  <rect class="chip" x="1264" y="742" width="272" height="44" rx="8"/>
  <text class="t chip-main" x="1278" y="760">ring 10 / 3 / 1</text>
  <text class="t chip-sub" x="1278" y="775">3 replicas · 1 zone · 4 devices</text>

  <!-- ================= CONNECTION LABELS ================= -->
  <text class="t label" x="840" y="272" text-anchor="end">VXLAN</text>
