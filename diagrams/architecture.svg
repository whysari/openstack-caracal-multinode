  <text class="t chip-sub" x="458" y="735">169.254.169.254 · OVS firewall</text>

  <text class="t note" x="64" y="770">The tenant instance lives on compute1; its tap is bound to the VXLAN network.</text>
  <text class="t note" x="64" y="788">North–south traffic is NATed in the qrouter namespace on the controller.</text>

