<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">OpenStack Caracal 5-node private cloud architecture</title>
  <desc id="desc">Three physical nodes (controller, compute1, compute2) and two virtual nodes (block, object). The controller runs the control plane, the Neutron network services (OVS, L3, DHCP, metadata) and the Swift proxy on br-ex. Compute1 and compute2 run nova-compute, KVM and OVS agents. Block runs cinder-volume with LVM and tgt iSCSI. Object runs the Swift account, container and object servers with four devices. The self-service VXLAN network is 172.16.1.0/24; management and the flat provider network share 192.168.100.0/24, with floating IPs from 192.168.100.101 to 192.168.100.250.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#326CE5"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E8B57"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2410C"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #d5deea; stroke-width: 1.5; }
      .chip { fill: #f2f6fb; stroke: #dbe4ef; stroke-width: 1; }
      .warn { fill: #fff7ed; stroke: #fdba74; stroke-width: 1; }
      .t { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .title { font-size: 16px; font-weight: 650; }
      .sub { font-size: 12px; fill: #5b6575; }
      .chip-main { font-size: 12.5px; font-weight: 600; }
      .chip-sub { font-size: 10.5px; fill: #5b6575; }
      .note { font-size: 11px; fill: #5b6575; }
      .label { font-size: 10.5px; fill: #475569; font-weight: 600; }
      .data { stroke: #326CE5; stroke-width: 2; fill: none; }
      .mgmt { stroke: #94a3b8; stroke-width: 1.6; stroke-dasharray: 6 5; fill: none; }
      .swift { stroke: #2E8B57; stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; }
      .iscsi { stroke: #C2410C; stroke-width: 1.8; stroke-dasharray: 5 4; fill: none; }
    </style>
  </defs>

